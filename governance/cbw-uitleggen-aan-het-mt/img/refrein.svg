<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t-refrein d-refrein" font-family="system-ui, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><title id="t-refrein">Welk risico? Wie koos? Waar staat het?</title><desc id="d-refrein">Drie stappen: een waarschuwingsdriehoek (welk risico), een persoon met een pen (wie koos) en een document met een vinkje (waar staat het). Daaronder beschikbaarheid, integriteit en vertrouwelijkheid.</desc><rect x="1" y="1" width="798" height="448" rx="16" fill="#0d2b4d" stroke="#2f5682" stroke-width="2"/><g data-gevaar="90 64 210 168.4"><polygon points="150,64 90,168.4 210,168.4" fill="#e17000" stroke="#0d2b4d" stroke-width="2" stroke-linejoin="round"/><rect x="143.4" y="98.452" width="13.2" height="37.584" rx="4.8" fill="#0d2b4d"/><circle cx="150" cy="150.652" r="7.8" fill="#0d2b4d"/></g><circle cx="400" cy="80" r="18" fill="#c9d6e4"/><path d="M368 154 q0 -50 32 -50 q32 0 32 50 z" fill="#c9d6e4"/><rect x="434" y="120" width="46" height="8" rx="3" fill="#e17000" transform="rotate(-35 457 124)"/><rect x="612" y="58" width="84" height="110" rx="4" fill="#f4f6f9"/><rect x="626" y="78" width="56" height="7" rx="2" fill="#c9d6e4"/><rect x="626" y="96" width="42" height="7" rx="2" fill="#c9d6e4"/><rect x="626" y="114" width="56" height="7" rx="2" fill="#c9d6e4"/><rect x="626" y="132" width="42" height="7" rx="2" fill="#c9d6e4"/><path d="M628 150 l10 10 l22 -24" fill="none" stroke="#e17000" stroke-width="5"/><line x1="222" y1="120" x2="316" y2="120" stroke="#c9d6e4" stroke-width="3" stroke-linecap="round"/><polygon points="330,120 316,128 316,112" fill="#c9d6e4"/><line x1="478" y1="120" x2="576" y2="120" stroke="#c9d6e4" stroke-width="3" stroke-linecap="round"/><polygon points="590,120 576,128 576,112" fill="#c9d6e4"/><text x="150" y="222" font-size="26" font-weight="700" text-anchor="middle" fill="#ffffff">Welk risico?</text><text x="150" y="250" font-size="16" font-weight="400" text-anchor="middle" fill="#c9d6e4">wat kan er misgaan</text><text x="400" y="222" font-size="26" font-weight="700" text-anchor="middle" fill="#ffffff">Wie koos?</text><text x="400" y="250" font-size="16" font-weight="400" text-anchor="middle" fill="#c9d6e4">met naam en datum</text><text x="654" y="222" font-size="26" font-weight="700" text-anchor="middle" fill="#ffffff">Waar staat het?</text><text x="654" y="250" font-size="16" font-weight="400" text-anchor="middle" fill="#c9d6e4">terug te vinden</text><text x="400" y="306" font-size="17" font-weight="400" text-anchor="middle" fill="#c9d6e4">bij elk risico: werkt het, klopt het, blijft het binnen?</text><rect x="38" y="330" width="224" height="56" rx="28" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><circle cx="68" cy="358" r="20" fill="#e17000"/><text x="68" y="366" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">B</text><text x="96" y="364" font-size="17" font-weight="400" text-anchor="start" fill="#ffffff">beschikbaarheid</text><rect x="290" y="330" width="224" height="56" rx="28" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><circle cx="320" cy="358" r="20" fill="#e17000"/><text x="320" y="366" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">I</text><text x="348" y="364" font-size="17" font-weight="400" text-anchor="start" fill="#ffffff">integriteit</text><rect x="542" y="330" width="224" height="56" rx="28" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><circle cx="572" cy="358" r="20" fill="#e17000"/><text x="572" y="366" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">V</text><text x="600" y="364" font-size="17" font-weight="400" text-anchor="start" fill="#ffffff">vertrouwelijkheid</text></svg>
