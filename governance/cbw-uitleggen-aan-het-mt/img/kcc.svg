<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t-kcc d-kcc" font-family="system-ui, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><title id="t-kcc">Het klantcontactcentrum hoort het als eerste</title><desc id="d-kcc">Een medewerker met headset krijgt telefoontjes van inwoners over een storing in het webformulier. Stippellijnen lopen naar drie loketten: servicedesk, webbeheer en leverancier.</desc><rect x="1" y="1" width="798" height="448" rx="16" fill="#0d2b4d" stroke="#2f5682" stroke-width="2"/><rect x="40" y="34" width="250" height="40" rx="20" fill="#f4f6f9"/><text x="165" y="60" font-size="16" font-weight="400" text-anchor="middle" fill="#0d2b4d">Mijn aanvraag is weg?</text><rect x="60" y="86" width="230" height="40" rx="20" fill="#f4f6f9"/><text x="175" y="112" font-size="16" font-weight="400" text-anchor="middle" fill="#0d2b4d">De site doet raar.</text><circle cx="110" cy="194" r="18" fill="#c9d6e4"/><path d="M78 268 q0 -50 32 -50 q32 0 32 50 z" fill="#c9d6e4"/><path d="M86 194 a24 24 0 0 1 48 0" fill="none" stroke="#e17000" stroke-width="5"/><rect x="40" y="276" width="300" height="16" rx="3" fill="#c9d6e4"/><rect x="170" y="170" width="160" height="100" rx="6" fill="#f4f6f9" stroke="#c9d6e4" stroke-width="2"/><text x="250" y="212" font-size="18" font-weight="700" text-anchor="middle" fill="#e17000">storing</text><text x="250" y="240" font-size="15" font-weight="400" text-anchor="middle" fill="#0d2b4d">webformulier</text><g data-gevaar="310 150 346 181.32"><polygon points="328,150 310,181.32 346,181.32" fill="#e17000" stroke="#0d2b4d" stroke-width="2" stroke-linejoin="round"/><rect x="326.02" y="160.336" width="3.96" height="11.2752" rx="1.44" fill="#0d2b4d"/><circle cx="328" cy="175.996" r="2.34" fill="#0d2b4d"/></g><rect x="520" y="110" width="230" height="54" rx="8" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><text x="635" y="144" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">servicedesk</text><line x1="348" y1="226" x2="512" y2="137" stroke="#c9d6e4" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><rect x="520" y="202" width="230" height="54" rx="8" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><text x="635" y="236" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">webbeheer</text><line x1="348" y1="226" x2="512" y2="229" stroke="#c9d6e4" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><rect x="520" y="294" width="230" height="54" rx="8" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><text x="635" y="328" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">leverancier</text><line x1="348" y1="226" x2="512" y2="321" stroke="#c9d6e4" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><text x="400" y="418" font-size="18" font-weight="700" text-anchor="middle" fill="#c9d6e4">drie loketten, geen eigenaar</text></svg>
