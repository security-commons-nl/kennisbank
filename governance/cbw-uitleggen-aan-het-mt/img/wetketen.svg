<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t-wetketen d-wetketen" font-family="system-ui, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><title id="t-wetketen">Van Europese richtlijn tot jullie organisatie</title><desc id="d-wetketen">Een trap van vier treden: NIS2, de Cyberbeveiligingswet, de regeling sector overheid en de BIO2 met ISO 27001. Onderaan staat het gemeentehuis.</desc><rect x="1" y="1" width="798" height="448" rx="16" fill="#0d2b4d" stroke="#2f5682" stroke-width="2"/><rect x="40" y="34" width="290" height="60" rx="8" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><text x="56" y="60" font-size="18" font-weight="700" text-anchor="start" fill="#ffffff">NIS2</text><text x="56" y="83" font-size="15" font-weight="400" text-anchor="start" fill="#c9d6e4">Europese richtlijn</text><line x1="90" y1="94" x2="90" y2="140" stroke="#c9d6e4" stroke-width="2" stroke-linecap="round"/><line x1="90" y1="140" x2="124" y2="140" stroke="#c9d6e4" stroke-width="3" stroke-linecap="round"/><polygon points="138,140 124,148 124,132" fill="#c9d6e4"/><rect x="140" y="110" width="290" height="60" rx="8" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><text x="156" y="136" font-size="18" font-weight="700" text-anchor="start" fill="#ffffff">Cyberbeveiligingswet</text><text x="156" y="159" font-size="15" font-weight="400" text-anchor="start" fill="#c9d6e4">sinds 15 augustus 2026</text><line x1="190" y1="170" x2="190" y2="216" stroke="#c9d6e4" stroke-width="2" stroke-linecap="round"/><line x1="190" y1="216" x2="224" y2="216" stroke="#c9d6e4" stroke-width="3" stroke-linecap="round"/><polygon points="238,216 224,224 224,208" fill="#c9d6e4"/><rect x="240" y="186" width="290" height="60" rx="8" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><text x="256" y="212" font-size="18" font-weight="700" text-anchor="start" fill="#ffffff">Regeling sector overheid</text><text x="256" y="235" font-size="15" font-weight="400" text-anchor="start" fill="#c9d6e4">wijst de norm aan</text><line x1="290" y1="246" x2="290" y2="292" stroke="#c9d6e4" stroke-width="2" stroke-linecap="round"/><line x1="290" y1="292" x2="324" y2="292" stroke="#c9d6e4" stroke-width="3" stroke-linecap="round"/><polygon points="338,292 324,300 324,284" fill="#c9d6e4"/><rect x="340" y="262" width="290" height="60" rx="8" fill="#e17000" stroke="#c9d6e4" stroke-width="2"/><text x="356" y="288" font-size="18" font-weight="700" text-anchor="start" fill="#ffffff">BIO2 en ISO 27001</text><text x="356" y="311" font-size="15" font-weight="400" text-anchor="start" fill="#ffffff">de maatregelen</text><polygon points="650,348 710,318 770,348" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><rect x="660" y="348" width="100" height="52" rx="3" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><rect x="678" y="360" width="14" height="12" rx="2" fill="#c9d6e4"/><rect x="703" y="360" width="14" height="12" rx="2" fill="#c9d6e4"/><rect x="728" y="360" width="14" height="12" rx="2" fill="#c9d6e4"/><line x1="632" y1="292" x2="675.659" y2="315.389" stroke="#c9d6e4" stroke-width="3" stroke-linecap="round"/><polygon points="688,322 671.882,322.441 679.437,308.337" fill="#c9d6e4"/><text x="710" y="428" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">jullie gemeente</text></svg>
