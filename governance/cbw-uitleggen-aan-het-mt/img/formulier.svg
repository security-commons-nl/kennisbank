<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t-formulier d-formulier" font-family="system-ui, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><title id="t-formulier">Een lek in de software achter de online formulieren</title><desc id="d-formulier">Een online aanvraagformulier met naam, burgerservicenummer en bijlage. Rechts een melding over een kritiek lek met een update, en het bestek waarin de eisen hadden moeten staan.</desc><rect x="1" y="1" width="798" height="448" rx="16" fill="#0d2b4d" stroke="#2f5682" stroke-width="2"/><rect x="50" y="40" width="470" height="370" rx="8" fill="#f4f6f9"/><rect x="50" y="40" width="470" height="34" rx="8" fill="#c9d6e4"/><rect x="50" y="62" width="470" height="12" rx="0" fill="#c9d6e4"/><circle cx="70" cy="57" r="5" fill="#154273"/><circle cx="88" cy="57" r="5" fill="#154273"/><circle cx="106" cy="57" r="5" fill="#154273"/><text x="80" y="116" font-size="21" font-weight="700" text-anchor="start" fill="#0d2b4d">Online aanvraag</text><text x="80" y="150" font-size="15" font-weight="400" text-anchor="start" fill="#14202b">Naam</text><rect x="80" y="160" width="320" height="30" rx="3" fill="#ffffff" stroke="#c9d6e4" stroke-width="2"/><text x="80" y="220" font-size="15" font-weight="400" text-anchor="start" fill="#14202b">Burgerservicenummer</text><rect x="80" y="230" width="320" height="30" rx="3" fill="#ffffff" stroke="#c9d6e4" stroke-width="2"/><text x="80" y="290" font-size="15" font-weight="400" text-anchor="start" fill="#14202b">Bijlage</text><rect x="80" y="300" width="320" height="30" rx="3" fill="#ffffff" stroke="#c9d6e4" stroke-width="2"/><rect x="80" y="360" width="130" height="34" rx="4" fill="#154273"/><text x="145" y="383" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">Verzenden</text><rect x="560" y="100" width="200" height="84" rx="8" fill="#e17000"/><text x="660" y="136" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">kritiek lek</text><text x="660" y="164" font-size="15" font-weight="400" text-anchor="middle" fill="#ffffff">update beschikbaar</text><line x1="556" y1="142" x2="538" y2="142" stroke="#e17000" stroke-width="3" stroke-linecap="round"/><polygon points="524,142 538,134 538,150" fill="#e17000"/><g data-gevaar="540 38 580 72.8"><polygon points="560,38 540,72.8 580,72.8" fill="#e17000" stroke="#0d2b4d" stroke-width="2" stroke-linejoin="round"/><rect x="557.8" y="49.484" width="4.4" height="12.528" rx="1.6" fill="#0d2b4d"/><circle cx="560" cy="66.884" r="2.6" fill="#0d2b4d"/></g><rect x="608" y="222" width="104" height="130" rx="4" fill="#f4f6f9"/><rect x="622" y="244" width="76" height="7" rx="2" fill="#c9d6e4"/><rect x="622" y="264" width="56" height="7" rx="2" fill="#c9d6e4"/><rect x="622" y="284" width="76" height="7" rx="2" fill="#c9d6e4"/><rect x="622" y="304" width="56" height="7" rx="2" fill="#c9d6e4"/><text x="660" y="384" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">het bestek</text><text x="660" y="408" font-size="15" font-weight="400" text-anchor="middle" fill="#c9d6e4">eisen erin gezet?</text></svg>
