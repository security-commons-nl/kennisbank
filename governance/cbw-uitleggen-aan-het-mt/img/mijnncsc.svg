<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t-mijnncsc d-mijnncsc" font-family="system-ui, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><title id="t-mijnncsc">Het portaal MijnNCSC, nagebouwd</title><desc id="d-mijnncsc">Een nagebouwde startpagina van het NCSC-portaal met zes tegels. Gemarkeerd: de geregistreerde organisatie, de tegel Meldingen met de knop Melding maken, en de Flash-reports.</desc><rect x="1" y="1" width="798" height="448" rx="16" fill="#0d2b4d" stroke="#2f5682" stroke-width="2"/><rect x="30" y="22" width="740" height="406" rx="10" fill="#f4f6f9"/><rect x="30" y="22" width="740" height="44" rx="10" fill="#ffffff"/><rect x="30" y="54" width="740" height="12" rx="0" fill="#ffffff"/><polygon points="56,46 66,37 76,46" fill="#154273"/><rect x="59" y="46" width="14" height="10" rx="0" fill="#154273"/><text x="86" y="51" font-size="17" font-weight="700" text-anchor="start" fill="#154273">MijnNCSC</text><text x="184" y="51" font-size="15" font-weight="400" text-anchor="start" fill="#14202b">Mijn producten en diensten</text><circle cx="456" cy="44" r="7" fill="#c62828"/><rect x="478.54" y="31" width="134.92" height="25" rx="12.5" fill="#e17000" data-label="1"/><text x="546" y="50" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">geregistreerd</text><text x="756" y="51" font-size="14" font-weight="400" text-anchor="end" fill="#14202b">[naam], [organisatie]</text><text x="52" y="96" font-size="20" font-weight="700" text-anchor="start" fill="#3c1a5b">Goedemiddag,</text><rect x="46" y="108" width="708" height="34" rx="4" fill="#fbf1c4"/><text x="62" y="131" font-size="15" font-weight="400" text-anchor="start" fill="#14202b">Direct hulp nodig bij een incident? Bel het NCSC: 070 751 5555</text><rect x="46" y="154" width="228" height="122" rx="6" fill="#ffffff" stroke="#c9d6e4" stroke-width="2"/><text x="60" y="184" font-size="17" font-weight="700" text-anchor="start" fill="#154273">Cyberbeeld</text><text x="60" y="210" font-size="13" font-weight="400" text-anchor="start" fill="#14202b">Je eigen netwerk in beeld</text><text x="60" y="254" font-size="14" font-weight="400" text-anchor="start" fill="#154273">› Cyberbeeld bekijken</text><rect x="285" y="154" width="228" height="122" rx="6" fill="#ffffff" stroke="#c9d6e4" stroke-width="2"/><text x="299" y="184" font-size="17" font-weight="700" text-anchor="start" fill="#154273">Direct naar</text><text x="299" y="210" font-size="13" font-weight="400" text-anchor="start" fill="#14202b">Vragen en meer over de Cbw</text><text x="299" y="254" font-size="14" font-weight="400" text-anchor="start" fill="#154273">› Ik heb een vraag</text><rect x="524" y="154" width="228" height="122" rx="6" fill="#ffffff" stroke="#c9d6e4" stroke-width="2"/><text x="538" y="184" font-size="17" font-weight="700" text-anchor="start" fill="#154273">Flash-reports</text><text x="538" y="210" font-size="13" font-weight="400" text-anchor="start" fill="#14202b">Actuele incidenten ontleed</text><text x="538" y="254" font-size="14" font-weight="400" text-anchor="start" fill="#154273">› Overzicht</text><rect x="624.76" y="235" width="117.24" height="25" rx="12.5" fill="#e17000" data-label="1"/><text x="683.38" y="254" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">waarschuwen</text><rect x="524" y="154" width="228" height="122" rx="6" fill="none" stroke="#e17000" stroke-width="3"/><rect x="46" y="288" width="228" height="122" rx="6" fill="#ffffff" stroke="#c9d6e4" stroke-width="2"/><text x="60" y="318" font-size="17" font-weight="700" text-anchor="start" fill="#154273">Meldingen</text><text x="60" y="344" font-size="13" font-weight="400" text-anchor="start" fill="#14202b">Incidenten melden en bijhouden</text><rect x="60" y="368" width="128" height="28" rx="3" fill="#e17000"/><text x="124" y="387" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Melding maken</text><rect x="190.96" y="369" width="73.04" height="25" rx="12.5" fill="#e17000" data-label="1"/><text x="227.48" y="388" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">melden</text><rect x="46" y="288" width="228" height="122" rx="6" fill="none" stroke="#e17000" stroke-width="3"/><rect x="285" y="288" width="228" height="122" rx="6" fill="#ffffff" stroke="#c9d6e4" stroke-width="2"/><text x="299" y="318" font-size="17" font-weight="700" text-anchor="start" fill="#154273">Beveiligingsadviezen</text><text x="299" y="344" font-size="13" font-weight="400" text-anchor="start" fill="#14202b">Wat te doen bij een nieuw lek</text><text x="299" y="388" font-size="14" font-weight="400" text-anchor="start" fill="#154273">› Alle adviezen</text><rect x="524" y="288" width="228" height="122" rx="6" fill="#ffffff" stroke="#c9d6e4" stroke-width="2"/><text x="538" y="318" font-size="17" font-weight="700" text-anchor="start" fill="#154273">Data-analyse</text><text x="538" y="344" font-size="13" font-weight="400" text-anchor="start" fill="#14202b">Malware laten onderzoeken</text><text x="538" y="388" font-size="14" font-weight="400" text-anchor="start" fill="#154273">› Mijn analyses</text></svg>
