<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t-meldklok d-meldklok" font-family="system-ui, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><title id="t-meldklok">Melden is een klok</title><desc id="d-meldklok">Een tijdlijn met vier stappen: ontdekt (is het significant?), binnen 24 uur waarschuwen, binnen 72 uur melden en binnen een maand het eindverslag.</desc><rect x="1" y="1" width="798" height="448" rx="16" fill="#0d2b4d" stroke="#2f5682" stroke-width="2"/><circle cx="80" cy="112" r="40" fill="none" stroke="#c9d6e4" stroke-width="4"/><rect x="72" y="62" width="16" height="10" rx="2" fill="#c9d6e4"/><line x1="80" y1="112" x2="80" y2="84" stroke="#e17000" stroke-width="4" stroke-linecap="round"/><line x1="80" y1="112" x2="100" y2="122" stroke="#c9d6e4" stroke-width="4" stroke-linecap="round"/><text x="140" y="108" font-size="19" font-weight="700" text-anchor="start" fill="#ffffff">de klok loopt vanaf het moment dat je het weet</text><text x="140" y="134" font-size="16" font-weight="400" text-anchor="start" fill="#c9d6e4">niet vanaf het moment dat je het zeker weet</text><line x1="40" y1="304" x2="770" y2="304" stroke="#c9d6e4" stroke-width="3" stroke-linecap="round"/><rect x="12" y="196" width="160" height="74" rx="8" fill="#e17000" stroke="#c9d6e4" stroke-width="2"/><text x="92" y="228" font-size="19" font-weight="700" text-anchor="middle" fill="#ffffff">ontdekt</text><text x="92" y="254" font-size="15" font-weight="400" text-anchor="middle" fill="#ffffff">significant?</text><line x1="92" y1="270" x2="92" y2="304" stroke="#c9d6e4" stroke-width="2" stroke-linecap="round"/><circle cx="92" cy="304" r="7" fill="#e17000"/><text x="92" y="336" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">T = 0</text><rect x="182" y="196" width="160" height="74" rx="8" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><text x="262" y="228" font-size="19" font-weight="700" text-anchor="middle" fill="#ffffff">waarschuwen</text><text x="262" y="254" font-size="15" font-weight="400" text-anchor="middle" fill="#ffffff">vroegtijdig</text><line x1="262" y1="270" x2="262" y2="304" stroke="#c9d6e4" stroke-width="2" stroke-linecap="round"/><circle cx="262" cy="304" r="7" fill="#c9d6e4"/><text x="262" y="336" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">24 uur</text><rect x="352" y="196" width="160" height="74" rx="8" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><text x="432" y="228" font-size="19" font-weight="700" text-anchor="middle" fill="#ffffff">melden</text><text x="432" y="254" font-size="15" font-weight="400" text-anchor="middle" fill="#ffffff">eerste beoordeling</text><line x1="432" y1="270" x2="432" y2="304" stroke="#c9d6e4" stroke-width="2" stroke-linecap="round"/><circle cx="432" cy="304" r="7" fill="#c9d6e4"/><text x="432" y="336" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">72 uur</text><rect x="588" y="196" width="160" height="74" rx="8" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><text x="668" y="228" font-size="19" font-weight="700" text-anchor="middle" fill="#ffffff">eindverslag</text><text x="668" y="254" font-size="15" font-weight="400" text-anchor="middle" fill="#ffffff">oorzaak en herstel</text><line x1="668" y1="270" x2="668" y2="304" stroke="#c9d6e4" stroke-width="2" stroke-linecap="round"/><circle cx="668" cy="304" r="7" fill="#c9d6e4"/><text x="668" y="336" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">1 maand</text><g data-gevaar="143 160 177 189.58"><polygon points="160,160 143,189.58 177,189.58" fill="#e17000" stroke="#0d2b4d" stroke-width="2" stroke-linejoin="round"/><rect x="158.13" y="169.761" width="3.74" height="10.6488" rx="1.36" fill="#0d2b4d"/><circle cx="160" cy="184.551" r="2.21" fill="#0d2b4d"/></g><text x="400" y="404" font-size="17" font-weight="400" text-anchor="middle" fill="#c9d6e4">Melden bij het CSIRT en de toezichthouder, via één portaal</text></svg>
