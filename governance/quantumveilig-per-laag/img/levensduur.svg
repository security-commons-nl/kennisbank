<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="system-ui, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><title id="t">Een gemaal dat tot 2045 draait, met een slot dat in 2030 open kan</title><desc id="d">Een gemaal gekocht in 2026 draait tot 2045. Tot 2030 is de versleuteling veilig, daarna vijftien jaar niet meer.</desc><rect x="1" y="1" width="798" height="448" rx="16" fill="#0d2b4d" stroke="#2f5682" stroke-width="2"/><polygon points="410,112 470,84 530,112" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><rect x="420" y="112" width="100" height="70" rx="0" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><rect x="456" y="142" width="28" height="40" rx="0" fill="#0d2b4d" stroke="#c9d6e4" stroke-width="2"/><rect x="520" y="150" width="60" height="12" rx="0" fill="#c9d6e4"/><rect x="568" y="150" width="12" height="44" rx="0" fill="#c9d6e4"/><path d="M550 200 q15 -10 30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="#6fa8dc" stroke-width="4"/><text x="400" y="152" font-size="20" font-weight="700" text-anchor="end" fill="#ffffff">gemaal</text><path d="M235.916 200 v-13.44 a9.6 9.6 0 0 0 -19.2 0 v-1.92" fill="none" stroke="#e17000" stroke-width="4.8" stroke-linecap="round"/><rect x="210.316" y="200" width="32" height="25.6" rx="3.84" fill="#e17000"/><rect x="100" y="250" width="126.316" height="40" rx="4" fill="#6fa8dc"/><text x="163.158" y="276" font-size="17" font-weight="700" text-anchor="middle" fill="#0d2b4d">veilig</text><rect x="226.316" y="250" width="473.684" height="40" rx="4" fill="#e17000"/><text x="463.158" y="276" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">slot kan open: vijftien jaar</text><line x1="100" y1="294" x2="100" y2="304" stroke="#c9d6e4" stroke-width="2"/><text x="100" y="324" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">2026</text><text x="100" y="348" font-size="17" font-weight="400" text-anchor="middle" fill="#c9d6e4">aanschaf</text><line x1="226.316" y1="294" x2="226.316" y2="304" stroke="#c9d6e4" stroke-width="2"/><text x="226.316" y="324" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">2030</text><text x="226.316" y="348" font-size="17" font-weight="400" text-anchor="middle" fill="#c9d6e4">quantumcomputer</text><line x1="700" y1="294" x2="700" y2="304" stroke="#c9d6e4" stroke-width="2"/><text x="700" y="324" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">2045</text><text x="700" y="348" font-size="17" font-weight="400" text-anchor="middle" fill="#c9d6e4">einde levensduur</text></svg>
