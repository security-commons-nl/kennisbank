<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="system-ui, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><title id="t">Wat je vandaag versleutelt, ligt in 2030 op straat</title><desc id="d">Een envelop met een dicht slot wordt in 2026 verstuurd, door een aanvaller onderschept en bewaard, en in 2030 met een open slot geopend: de papieren liggen op straat.</desc><rect x="1" y="1" width="798" height="448" rx="16" fill="#0d2b4d" stroke="#2f5682" stroke-width="2"/><line x1="40" y1="376" x2="760" y2="376" stroke="#c9d6e4" stroke-width="2"/><rect x="95" y="165" width="110" height="72" rx="4" fill="#f4f6f9"/><polyline points="95,165 150,207 205,165" fill="none" stroke="#154273" stroke-width="3"/><path d="M189 222 v-5.4 a9 9 0 0 1 18 0 v5.4" fill="none" stroke="#6fa8dc" stroke-width="4.5" stroke-linecap="round"/><rect x="183" y="222" width="30" height="24" rx="3.6" fill="#6fa8dc"/><text x="150" y="305" font-size="30" font-weight="700" text-anchor="middle" fill="#ffffff">2026</text><text x="150" y="334" font-size="19" font-weight="400" text-anchor="middle" fill="#c9d6e4">versleuteld verstuurd</text><line x1="240" y1="205" x2="308" y2="205" stroke="#c9d6e4" stroke-width="3"/><polygon points="318,205 304,197 304,213" fill="#c9d6e4"/><rect x="345" y="170" width="110" height="80" rx="4" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><rect x="338" y="156" width="124" height="18" rx="3" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><rect x="362" y="186" width="64" height="14" rx="2" fill="#f4f6f9"/><rect x="368" y="202" width="64" height="14" rx="2" fill="#f4f6f9"/><rect x="374" y="218" width="64" height="14" rx="2" fill="#f4f6f9"/><text x="400" y="305" font-size="30" font-weight="700" text-anchor="middle" fill="#ffffff">bewaard</text><text x="400" y="334" font-size="19" font-weight="400" text-anchor="middle" fill="#c9d6e4">door de aanvaller</text><line x1="482" y1="205" x2="550" y2="205" stroke="#c9d6e4" stroke-width="3"/><polygon points="560,205 546,197 546,213" fill="#c9d6e4"/><path d="M666.8 196 v-23.52 a16.8 16.8 0 0 0 -33.6 0 v-3.36" fill="none" stroke="#e17000" stroke-width="8.4" stroke-linecap="round"/><rect x="622" y="196" width="56" height="44.8" rx="6.72" fill="#e17000"/><text x="650" y="305" font-size="30" font-weight="700" text-anchor="middle" fill="#e17000">2030</text><text x="650" y="334" font-size="19" font-weight="400" text-anchor="middle" fill="#c9d6e4">open op straat</text><rect x="588" y="352" width="34" height="14" rx="2" fill="#f4f6f9" transform="rotate(-12 605 359)"/><rect x="628" y="358" width="34" height="14" rx="2" fill="#f4f6f9" transform="rotate(8 645 365)"/><rect x="668" y="350" width="34" height="14" rx="2" fill="#f4f6f9" transform="rotate(-4 685 357)"/><rect x="708" y="356" width="34" height="14" rx="2" fill="#f4f6f9" transform="rotate(14 725 363)"/></svg>
