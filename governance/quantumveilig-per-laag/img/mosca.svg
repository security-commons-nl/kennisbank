<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="system-ui, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><title id="t">De ongelijkheid van Mosca</title><desc id="d">Twee balken. Jouw gegevens: vijf jaar overstap plus tien jaar geheimhouding, tot 2041. De quantumcomputer: 2030. Alles na 2030 in de bovenste balk is nu al kwetsbaar.</desc><rect x="1" y="1" width="798" height="448" rx="16" fill="#0d2b4d" stroke="#2f5682" stroke-width="2"/><text x="110" y="108" font-size="17" font-weight="400" text-anchor="start" fill="#c9d6e4">jouw gegevens</text><rect x="110" y="120" width="190" height="48" rx="4" fill="#6fa8dc"/><text x="205" y="150" font-size="17" font-weight="700" text-anchor="middle" fill="#0d2b4d">overstap: 5 jaar</text><rect x="300" y="120" width="380" height="48" rx="4" fill="#f4f6f9"/><text x="490" y="150" font-size="17" font-weight="700" text-anchor="middle" fill="#0d2b4d">moet geheim blijven: 10 jaar</text><text x="252" y="222" font-size="17" font-weight="400" text-anchor="end" fill="#c9d6e4">quantumcomputer</text><rect x="110" y="234" width="152" height="48" rx="4" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><text x="186" y="264" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">2030</text><line x1="262" y1="172" x2="262" y2="322" stroke="#e17000" stroke-width="3" stroke-dasharray="7 6"/><line x1="262" y1="186" x2="680" y2="186" stroke="#e17000" stroke-width="4"/><line x1="680" y1="178" x2="680" y2="194" stroke="#e17000" stroke-width="4"/><text x="511" y="214" font-size="20" font-weight="700" text-anchor="middle" fill="#e17000">nu al kwetsbaar</text><line x1="110" y1="322" x2="718" y2="322" stroke="#c9d6e4" stroke-width="2"/><line x1="110" y1="316" x2="110" y2="328" stroke="#c9d6e4" stroke-width="2"/><text x="110" y="350" font-size="17" font-weight="400" text-anchor="middle" fill="#c9d6e4">2026</text><line x1="262" y1="316" x2="262" y2="328" stroke="#c9d6e4" stroke-width="2"/><text x="262" y="350" font-size="17" font-weight="400" text-anchor="middle" fill="#c9d6e4">2030</text><line x1="452" y1="316" x2="452" y2="328" stroke="#c9d6e4" stroke-width="2"/><text x="452" y="350" font-size="17" font-weight="400" text-anchor="middle" fill="#c9d6e4">2035</text><line x1="642" y1="316" x2="642" y2="328" stroke="#c9d6e4" stroke-width="2"/><text x="642" y="350" font-size="17" font-weight="400" text-anchor="middle" fill="#c9d6e4">2040</text><text x="400" y="405" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">overstap + geheimhouding  &gt;  tijd tot de quantumcomputer</text></svg>
