<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="system-ui, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><title id="t">Een verbouwing van het hele pand, terwijl de winkel open blijft</title><desc id="d">Een gebouw met vier verdiepingen (ICT en beheer, bedrijfsvoering, sociaal domein, dienstverlening) staat in de steigers van 2026 tot 2030; beneden hangt een bordje open.</desc><rect x="1" y="1" width="798" height="448" rx="16" fill="#0d2b4d" stroke="#2f5682" stroke-width="2"/><polygon points="205,92 370,48 535,92" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><rect x="220" y="92" width="300" height="55" rx="0" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><text x="240" y="126" font-size="17" font-weight="400" text-anchor="start" fill="#c9d6e4">ICT en beheer</text><rect x="220" y="147" width="300" height="55" rx="0" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><text x="240" y="181" font-size="17" font-weight="400" text-anchor="start" fill="#c9d6e4">Bedrijfsvoering</text><rect x="220" y="202" width="300" height="55" rx="0" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><text x="240" y="236" font-size="17" font-weight="400" text-anchor="start" fill="#c9d6e4">Sociaal domein</text><rect x="220" y="257" width="300" height="55" rx="0" fill="#154273" stroke="#c9d6e4" stroke-width="2"/><text x="240" y="291" font-size="17" font-weight="400" text-anchor="start" fill="#c9d6e4">Dienstverlening</text><rect x="470" y="262" width="36" height="48" rx="2" fill="#0d2b4d" stroke="#c9d6e4" stroke-width="2"/><rect x="408" y="272" width="52" height="20" rx="3" fill="#e17000"/><text x="434" y="287" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">OPEN</text><line x1="545" y1="70" x2="545" y2="310" stroke="#e17000" stroke-width="4"/><line x1="595" y1="70" x2="595" y2="310" stroke="#e17000" stroke-width="4"/><line x1="535" y1="92" x2="605" y2="92" stroke="#e17000" stroke-width="4"/><line x1="535" y1="147" x2="605" y2="147" stroke="#e17000" stroke-width="4"/><line x1="535" y1="202" x2="605" y2="202" stroke="#e17000" stroke-width="4"/><line x1="535" y1="257" x2="605" y2="257" stroke="#e17000" stroke-width="4"/><text x="625" y="182" font-size="26" font-weight="700" text-anchor="start" fill="#e17000">vijf jaar</text><text x="625" y="207" font-size="17" font-weight="400" text-anchor="start" fill="#c9d6e4">verbouwen</text><line x1="120" y1="310" x2="680" y2="310" stroke="#c9d6e4" stroke-width="2"/><rect x="220" y="342" width="380" height="10" rx="5" fill="#e17000"/><text x="220" y="382" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">2026</text><text x="600" y="382" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">2030</text><text x="410" y="420" font-size="17" font-weight="400" text-anchor="middle" fill="#c9d6e4">en de winkel blijft open</text></svg>
